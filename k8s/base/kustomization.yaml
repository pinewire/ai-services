apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-b

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: pinewire-helpdesk

resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml

# No `images:` transformer here on purpose. If the base rewrote the
# placeholder `service-b` to a real registry name, an overlay's own
# transformer would no longer match it and would silently do nothing.
# Each overlay pins the image instead.
