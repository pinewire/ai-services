name: Service B CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: b_user
          POSTGRES_PASSWORD: b_pass
          POSTGRES_DB: service_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b_user -d service_b"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://b_user:b_pass@localhost:5432/service_b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # cache: pip only looks for requirements.txt / pyproject.toml by
          # default, so it must be told about requirements-dev.txt or the step
          # errors out before dependencies are ever installed.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      # The eval runs as its own process, outside pytest, so the conftest
      # fixture that seeds the KB does not apply here.
      - name: Seed knowledge base
        env:
          EMBEDDING_PROVIDER: hashing
        run: python -m app.ingest kb

      - name: RAG evaluation
        env:
          EMBEDDING_PROVIDER: hashing
          LLM_PROVIDER: rule-based
        run: python -m app.evaluation evals/rag_eval.json

      - name: Upload RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: evals/rag_eval_report.json
          if-no-files-found: warn

  # Builds on every PR (proves the Dockerfile works and the container boots).
  # Pushes to GHCR only on merges to main. The image is built ONCE here and the
  # same bytes are what CD deploys — CD never rebuilds.
  build:
    name: Build image (push to GHCR on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to publish to ghcr.io
    env:
      LOCAL_IMAGE: service-b:${{ github.sha }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # /healthz needs no database, so this proves the image starts and serves
      # without standing up Postgres. Catches missing files and import errors.
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8000/healthz > /dev/null; then
              echo "container is serving"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs smoke
          exit 1

      # No secret to configure: GITHUB_TOKEN is injected automatically and
      # the `packages: write` permission above is what authorises the push.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the git SHA only — no mutable :latest. Note GHCR has no
      # server-side equivalent of ECR's immutable tags, so this is a
      # convention here rather than something the registry enforces.
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        id: push
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/service-b:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker push "$IMAGE"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Image pushed"
            echo ""
            echo "- tag: \`$IMAGE\`"
            echo "- digest: \`$DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
