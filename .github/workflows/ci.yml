name: Service B CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: b_user
          POSTGRES_PASSWORD: b_pass
          POSTGRES_DB: service_b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b_user -d service_b"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://b_user:b_pass@localhost:5432/service_b
        run: pytest -v

      - name: RAG evaluation
        env:
          DATABASE_URL: postgresql+asyncpg://b_user:b_pass@localhost:5432/service_b
          EMBEDDING_PROVIDER: hashing
          LLM_PROVIDER: rule-based
        run: python -m app.evaluation evals/rag_eval.json

      - name: Upload RAG evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: evals/rag_eval_report.json
